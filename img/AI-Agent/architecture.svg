<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 1200"
     width="760"
     height="1200"
     role="img"
     aria-labelledby="agent-architecture-title agent-architecture-desc"
     style="max-width: 100%; height: auto;"
     preserveAspectRatio="xMidYMid meet">
  <title id="agent-architecture-title">AI Agent 运行架构</title>
  <desc id="agent-architecture-desc">
    用户目标进入 Agent 运行时。运行时循环执行上下文组装、模型决策、工具调用和观察与状态更新，
    并与工具、环境和记忆交互。安全与人工审批、追踪与评测作为横切控制面覆盖整个过程。
    执行可因等待审批或外部输入而暂停，并在目标完成、超限、不可恢复错误或策略拦截时终止。
  </desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .heading { font-size: 28px; font-weight: 750; }
      .subheading { font-size: 15px; font-weight: 500; fill: #475569; }
      .section-title { font-size: 19px; font-weight: 750; }
      .card-title { font-size: 18px; font-weight: 750; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
      .chip { font-size: 13px; font-weight: 750; }
      .chip-blue { fill: #1e40af; }
      .chip-light { fill: #ffffff; }
      .security-title { fill: #991b1b; }
      .trace-title { fill: #115e59; }
      .step { font-size: 14px; font-weight: 800; fill: #ffffff; }
      .line-blue {
        fill: none;
        stroke: #1d4ed8;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-blue);
      }
      .line-slate {
        fill: none;
        stroke: #334155;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-slate);
      }
    </style>
  </defs>

  <!-- Explicit light canvas keeps the diagram legible inside dark themes. -->
  <rect x="1" y="1" width="758" height="1198" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="380" y="48" class="heading" text-anchor="middle">AI Agent：从目标到行动的反馈闭环</text>
  <text x="380" y="76" class="subheading" text-anchor="middle">模型负责决策，工具负责执行，状态与反馈推动下一轮行动</text>

  <!-- User goal -->
  <rect x="130" y="102" width="500" height="78" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="174" cy="141" r="22" fill="#1d4ed8"/>
  <path d="M166 145c2-10 14-10 16 0M174 137a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"
        fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="212" y="134" class="card-title">用户目标</text>
  <text x="212" y="158" class="body">任务、约束、成功标准与可用权限</text>
  <path d="M380 180 V218" class="line-blue"/>

  <!-- Agent runtime -->
  <rect x="40" y="222" width="680" height="510" rx="22" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="40" y="222" width="680" height="62" rx="22" fill="#e2e8f0"/>
  <path d="M40 262 V284 H720 V262" fill="#e2e8f0"/>
  <text x="72" y="261" class="section-title">Agent 运行时（Runtime）</text>
  <rect x="566" y="240" width="122" height="28" rx="14" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="627" y="259" class="chip chip-blue" text-anchor="middle">循环 / 暂停 / 终止</text>

  <!-- Step 1: context -->
  <rect x="78" y="310" width="258" height="128" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="108" cy="340" r="17" fill="#2563eb"/>
  <text x="108" y="345" class="step" text-anchor="middle">1</text>
  <text x="136" y="346" class="card-title">上下文组装</text>
  <text x="104" y="379" class="body">指令、对话、检索结果</text>
  <text x="104" y="403" class="body">当前状态与剩余预算</text>

  <!-- Step 2: model -->
  <rect x="424" y="310" width="258" height="128" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="454" cy="340" r="17" fill="#7c3aed"/>
  <text x="454" y="345" class="step" text-anchor="middle">2</text>
  <text x="482" y="346" class="card-title">模型决策</text>
  <text x="450" y="379" class="body">根据目标与约束选择：</text>
  <text x="450" y="403" class="body">行动、回答、等待或结束</text>

  <!-- Step 3: tool call -->
  <rect x="424" y="500" width="258" height="128" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <circle cx="454" cy="530" r="17" fill="#c2410c"/>
  <text x="454" y="535" class="step" text-anchor="middle">3</text>
  <text x="482" y="536" class="card-title">工具调用</text>
  <text x="450" y="569" class="body">用结构化参数调用</text>
  <text x="450" y="593" class="body">受控、可验证的外部能力</text>

  <!-- Step 4: observation and state -->
  <rect x="78" y="500" width="258" height="128" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <circle cx="108" cy="530" r="17" fill="#047857"/>
  <text x="108" y="535" class="step" text-anchor="middle">4</text>
  <text x="136" y="536" class="card-title">观察与状态</text>
  <text x="104" y="569" class="body">接收结果、更新状态</text>
  <text x="104" y="593" class="body">检查失败与终止条件</text>

  <!-- Runtime loop arrows -->
  <path d="M336 374 H424" class="line-blue"/>
  <path d="M553 438 V500" class="line-blue"/>
  <path d="M424 564 H336" class="line-blue"/>
  <path d="M207 500 V438" class="line-blue"/>
  <rect x="326" y="456" width="108" height="28" rx="14" fill="#dbeafe"/>
  <text x="380" y="475" class="chip chip-blue" text-anchor="middle">反馈驱动</text>

  <rect x="78" y="660" width="604" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="380" y="686" class="small" text-anchor="middle">
    终止：目标完成 · 超限 · 不可恢复错误 · 策略拦截　｜　暂停：等待审批或外部输入
  </text>

  <!-- Bidirectional interaction with capabilities -->
  <path d="M365 732 V777" class="line-slate"/>
  <path d="M395 777 V732" class="line-slate"/>
  <text x="430" y="760" class="small">行动 / 反馈</text>

  <!-- Connected capabilities -->
  <text x="40" y="806" class="section-title">可连接能力与外部世界</text>

  <rect x="40" y="826" width="210" height="124" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="64" y="858" class="card-title">工具</text>
  <text x="64" y="886" class="body">API · 搜索 · 代码执行</text>
  <text x="64" y="911" class="body">数据库 · 业务操作</text>
  <text x="64" y="934" class="small">提供明确输入与结果</text>

  <rect x="275" y="826" width="210" height="124" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="299" y="858" class="card-title">环境</text>
  <text x="299" y="886" class="body">网页 · 文件系统</text>
  <text x="299" y="911" class="body">应用 · 真实业务状态</text>
  <text x="299" y="934" class="small">行动发生并产生变化</text>

  <rect x="510" y="826" width="210" height="124" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="534" y="858" class="card-title">记忆</text>
  <text x="534" y="886" class="body">会话状态 · 向量检索</text>
  <text x="534" y="911" class="body">长期事实 · 执行记录</text>
  <text x="534" y="934" class="small">按需读取，受控写入</text>

  <!-- Cross-cutting control plane -->
  <rect x="40" y="984" width="680" height="174" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="62" y="970" width="262" height="30" rx="15" fill="#334155"/>
  <text x="193" y="990" class="chip chip-light" text-anchor="middle">横切控制面：覆盖整个执行链路</text>

  <rect x="66" y="1020" width="300" height="112" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="90" y="1052" class="card-title security-title">安全与人工审批</text>
  <text x="90" y="1081" class="body">最小权限 · 参数校验 · 沙箱隔离</text>
  <text x="90" y="1106" class="body">敏感动作暂停并请求确认</text>

  <rect x="394" y="1020" width="300" height="112" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="418" y="1052" class="card-title trace-title">追踪与评测</text>
  <text x="418" y="1081" class="body">轨迹 · 延迟 · 成本 · 工具成功率</text>
  <text x="418" y="1106" class="body">任务完成率与回归测试集</text>

  <text x="380" y="1181" class="small" text-anchor="middle">
    可靠 Agent = 可控决策 + 受限行动 + 可观测反馈
  </text>
</svg>
